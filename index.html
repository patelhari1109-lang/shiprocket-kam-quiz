   {type:'text', title:'Reading the rate card',
    body:'Choose a plan and a zone, and the rate card shows every courier’s rate; “Compare plans” shows one courier across all plans. Rates are forward-shipment, <b>before GST</b>, and change often — re-open the page before quoting. <b>RTO rates are not on the forward card</b>, so ask for them. Each courier defines zones slightly differently (its own metro list), so when a buyer sends PIN codes, work out each zone from the pickup city first.'},
   {type:'table', title:'Weight terms',
    head:['Term','Meaning'],
    rows:[['Dead (actual / gross) weight','The packed parcel on a scale, box and filler included'],
          ['Volumetric (dimensional) weight','L × B × H (cm) ÷ 5000; the divisor varies by courier'],
          ['Chargeable (applied) weight','The higher of dead and volumetric — the weight that is priced'],
          ['Weight slab','First 500 g, then a fixed amount per extra 500 g (1 kg on heavy services); in-between weights round up'],
          ['Weight discrepancy','Courier re-weighs or re-measures, finds a higher chargeable weight, and bills the seller the difference']]},
   {type:'formula', pill:'Cost = [first slab + (extra slabs × extra rate)] + COD fee, then × 1.18 GST',
    legend:[['Step 1–3','weigh and measure; volumetric = L×B×H ÷ 5000; chargeable = the higher'],
            ['Step 4','round up to the next 500 g slab'],
            ['Step 5–7','freight from the rate card, add COD fee, add 18% GST']]},
   {type:'table', title:'Worked example: 1 kg vase, 20 × 20 × 20 cm box, Pune → Nagpur (Zone B), COD',
    head:['Step','If billed on dead weight','What really happens'],
    rows:[['Volumetric weight','Not used','8,000 ÷ 5000 = 1.6 kg'],
          ['Chargeable weight','1.0 kg','1.6 kg'],
          ['Slabs','2','2.0 kg = 4'],
          ['Freight (₹53 + ₹52 per extra)','₹105','₹209'],
          ['+ COD ₹48','₹153','₹257'],
          ['+ 18% GST','≈ ₹181','≈ ₹303']]},
   {type:'calc', calc:'landed', title:'Live: price one parcel from the rate card'},
   {type:'table', title:'Variable charges at a glance',
    head:['Charge','Rate card shows','Note'],
    rows:[['Forward freight','₹13–₹167 per 500 g on Lite','By zone and courier'],
          ['COD fee','≈ ₹34–₹56 per COD shipment on Lite','Only on COD orders'],
          ['RTO','Not on the forward card — ask','Usually billed for the return leg too'],
          ['GST','18%','Government-mandated, not negotiable']]},
   {type:'table', title:'Key add-ons and how they are priced',
    head:['Add-on','Pricing'],
    rows:[['Shiprocket Fulfillment','Pay-per-use storage and pick-pack, quoted on SKU count and monthly volume'],
          ['Shiprocket Checkout (Fastrr)','Subscription or per-transaction fee, separate from the shipping plan'],
          ['Engage 360','Monthly subscription, priced by messaging volume'],
          ['Shiprocket Capital','Processing fee plus interest on financing drawn'],
          ['Shiprocket X','Cross-border handling fee plus customs documentation']]},
   {type:'calc', calc:'bill', title:'Live: estimate a seller’s monthly shipping bill'},
   {type:'text', title:'Think it through: 400 parcels, 60% COD, Zones C and D, oversized boxes',
    body:'From the rate card you need: the <b>first-slab and extra-slab rates for Zones C and D</b> for two or three likely couriers on Advanced (and Pro for comparison), the <b>COD fee</b>, and the <b>RTO rate</b> (ask for it). Packaging questions: <i>What are your three most common box sizes? What do your best-sellers actually weigh packed? How often are you charged for weight discrepancy?</i> Then compute volumetric weight per box, find the slab, price 400 parcels by zone mix, add 240 COD fees, add GST — and note that at 400 shipments the Advanced fee is <b>not</b> refunded (that needs 500). A smaller box may cut more cost than any plan change.'}],
  check:[
   {t:'pricing',tag:'calc',diff:'medium',
    q:'A 40 × 30 × 20 cm box weighs 3 kg. What is its chargeable weight?',
    opts:['4.8 kg','3.0 kg','3.9 kg','24 kg'],
    why:'<div class="work">40 × 30 × 20 ÷ 5000 = 4.8 kg\nmax(3.0, 4.8) = 4.8 kg → billed as 5.0 kg (10 slabs)</div>3.9 kg averages the two; 24 kg forgets to divide by 5000.'},
   {t:'pricing',tag:'concept',diff:'easy',
    q:'Which charge is NOT shown on Shiprocket’s forward-shipment rate card?',
    opts:['The RTO (return) charge','The first-slab freight rate','The extra-slab freight rate','The per-zone courier rates'],
    why:'The rate card shows forward rates by plan, zone and courier, before GST. RTO rates are not on it, so a seller must ask for them before estimating real cost.'},
   {t:'pricing',tag:'apply',diff:'medium',
    q:'A Business-plan seller ships 80 parcels a month. Is the ₹199 fee refunded?',
    opts:['No — the refund needs 100 shipments','Yes — anything above 50 shipments qualifies','Yes — the Business plan is always free','No — refunds apply only to the Pro plan'],
    why:'Business refunds at 100 shipments, Advanced at 500 and Pro at 1,000. At 80 the seller still pays ₹199.'}]},

/* ───────────── 03 · ICP, SEGMENTS & CASE STUDIES (reckoner §03–06) ───────────── */
 market:{eyebrow:'Section 03 · Reckoner §03–06', title:'ICP, Segments & Case Studies',
  sub:'Who to sell to, where to find them, who to avoid, and how to use proof',
  steps:[
   {type:'text', title:'The ICP in one sentence',
    body:'<b>Any business selling physical goods online in India with a recurring shipping need</b> — from a one-person Instagram seller booking a first pickup to a funded, multi-channel D2C brand shipping thousands of orders a month. The free Lite tier is what lets the ICP span both ends.'},
   {type:'table', title:'ICP parameters',
    head:['Metric','Ideal parameter'],
    rows:[['Business model','Registered or unregistered India-based sellers of physical goods: D2C brands, marketplace sellers, social commerce sellers, traders'],
          ['Geography','India-headquartered, selling anywhere in India; optionally overseas via Shiprocket X'],
          ['Volume','A handful (Lite) to 2,500+ a month (Enterprise); <b>sales-led sweet spot ≈ 300–2,500 shipments a month</b>'],
          ['Channels','<b>2+ channels</b> (own site, Shopify, Amazon, Instagram/WhatsApp) feel the most pain from disconnected shipping'],
          ['Budget signal','Bootstrapped social sellers through to VC-backed D2C brands']]},
   {type:'table', title:'Operational trigger events',
    head:['Trigger','Lead with'],
    rows:[['Crossed a courier’s manual-booking limit; booking one at a time at a local office','Bulk processing, channel sync, one panel'],
          ['Outgrown one courier: PIN-code gaps, rigid rates','42+ couriers, 19,000+ PIN codes, CORE'],
          ['RTO or NDR eating margin; searching for RTO tools','RTO prediction, Partial COD, Engage 360, NDR automation'],
          ['Launching a new channel, e.g. Instagram-only → Shopify','Native integrations, order sync'],
          ['First international orders they can’t fulfil','Shiprocket X']]},
   {type:'text', title:'Think it through: desk research vs conversation',
    body:'<b>Findable before the call:</b> sales channels (website platform, Amazon and Flipkart listings, Instagram shop), rough volume (review counts, follower size, ads in the Meta Ads Library), whether checkout offers COD, delivery promises and tracking pages, funding news, “hiring ops” posts. <b>Only discoverable in conversation:</b> exact monthly shipments, COD share, RTO and NDR rates, current courier set-up and rates, weight-discrepancy pain, COD remittance delays, team time spent on manual work.'},
   {type:'table', title:'Target segments',
    head:['Segment','Why prioritise','Where to find leads','Names in client history'],
    rows:[['1 D2C fashion, beauty & personal care','High SKUs, size/shade returns, COD-heavy → RTO tools and multi-courier','Shopify / Instagram-commerce directories, founder communities, funding trackers','Mamaearth, mCaffeine, Cureveda'],
          ['2 Electronics, footwear & accessories','Higher AOV → weight disputes and damage claims cost more per parcel','Seller forums, marketplace directories','boAt, Relaxo'],
          ['3 Food, snacks & FMCG (D2C)','Fragile/perishable; start hyperlocal → zone-split Fulfillment','FSSAI directories, regional food-brand Instagram','MTR Foods, Bira 91'],
          ['4 Home, décor & lifestyle','Bulky/fragile → volumetric weight and courier choice','Home-décor directories, festive onboarding drives','Nappa Dori, Da Milano'],
          ['5 Social & quick-commerce sellers','Largest by count; free Lite entry → product-led, not sales-led','Social-commerce funnels, in-app signup','—'],
          ['6 Enterprise & omni-channel retail','High volume, many warehouses, negotiated Enterprise card → highest value, longest cycle','Referrals from large accounts, outbound to brands scaling online','—']]},
   {type:'watch', title:'Segments to approach with caution',
    body:'<b>1. One-off sellers</b> shipping two or three parcels a year: the free self-serve panel already serves them. <b>2. BYOA brands</b> running their own negotiated courier contracts on ClickPost or Shipsy: a longer, more technical cycle. <b>3. Price-sensitive single-courier loyalists</b> who resist a multi-courier panel out of habit.'},
   {type:'text', title:'Think it through: first month of outbound',
    body:'Focus on <b>D2C fashion & beauty</b> (COD-heavy, RTO pain, strong proof: 28.62% → 5.47%) and <b>electronics & accessories</b> (higher AOV makes every weight dispute and damaged parcel expensive). Opening lines differ by pain: beauty — <i>“What share of your COD orders come back?”</i>; electronics — <i>“How many weight-discrepancy or damage claims did you raise last month?”</i> Social sellers convert better through the free product than through calls; enterprise is valuable but slow.'},
   {type:'table', title:'Marquee clients by category (2,14,769 active merchants in FY26)',
    head:['Category','Names'],
    rows:[['Beauty & wellness','Mamaearth, mCaffeine, Cureveda, Dr. Vaidya’s, Gillette, Milagro Beauty, Krishna’s Herbal & Ayurveda, Husain Beauty Centre, Lili Origin'],
          ['Electronics & accessories','boAt, Orient Electric, The Ink Bucket, The Hatke'],
          ['Footwear & apparel','Relaxo, Proline, Sneakare, Bodycare, Spykar, Pothys, Sockscarving'],
          ['Food & beverage','MTR Foods, Orkla India, Bira 91, The Beer Cafe, Sardarji Papadwale, Maa Kaa Achar, Coastal Cashew, Chaayos, Third Wave Coffee, Suhana, Mali Grapes'],
          ['Lifestyle & others','Da Milano, Nappa Dori, Safari Industries, Ugees, Universal Tribes, Badthameez Store, Shippoz, Testbook'],
          ['Cross-border (Shiprocket X)','Swabhimann, Silver Hub USA; Freemen Enterprise (artificial jewellery)'],
          ['Last-mile partnerships','Shadowfax (same/next day), India Post, Skye Air (drones) — for brands like boAt, Mamaearth, MyGlamm']]},
   {type:'text', title:'Think it through: using names with different buyers',
    body:'With a <b>10-person D2C founder</b>, use a peer brand of similar size in the same category (Sneakare, Sardarji Papadwale, Ugees) and a specific outcome. With an <b>ops head at a 500-orders-a-day brand</b>, use scale names and operating numbers (boAt, Mamaearth, the Shadowfax and India Post last-mile partnerships, 1,000+ daily orders). Names from Shiprocket’s own case pages are safer to say aloud; names from press, a review site or a technology scan should be <b>checked first</b>. Never imply a brand endorsed your pitch.'},
   {type:'table', title:'Ten case studies',
    head:['#','Product','Result','Use when the buyer says'],
    rows:[['1','Checkout (Fastrr), D2C beauty','RTO 28.62% → 5.47% (≈ 81% lower) via AI COD switch-off, Partial COD, 5% prepaid discount','“COD is killing us and I can’t stop COD.”'],
          ['2','Checkout, growing D2C','Orders 1,631 → 5,706 (3.5X); OTP-less login 43.12% vs ~34%; 99%+ very-high-risk carts didn’t convert','“Risk checks will lose genuine customers.” (low-risk 44.3% vs riskiest 0.8%)'],
          ['3','Checkout, premium beauty (Magento)','Checkout conversion 27.86% → 46.24% (+66%); orders peaked at 681; prepaid ~70–75%','“Visitors don’t complete the purchase.”'],
          ['4','Checkout, plant care (Shopify)','Orders 525 → 18,983 (~36X); conversion 22.61% → 38.21%; prepaid 19.24% → 36%','“Can it handle my growth?” — checkout wasn’t the only cause'],
          ['5','Checkout, Krishna’s Herbal','+46% session conversions, +49% user conversions, +8% AOV (no baseline)','“Too many people abandon the cart.”'],
          ['6','Shipping + Engage, Milagro Beauty','Delivery 77% → 84.9%; RTO −8%; first-attempt delivery +10%','“My couriers keep failing to deliver.”'],
          ['7','Shipping + Engage, Sneakare','RTO −5%, logistics cost −10%+; delivery conversion +3–5% MoM; on-time pickups 39% → 62%','“My team spends all day on uploads and calls.”'],
          ['8','CORE + Fulfillment, Ugees','Delivery +10% in a quarter; ops cost −4%; on-time pickups 93% → 98%','“I don’t know enough about logistics.”'],
          ['9','Shiprocket X, Silver Hub USA','Shipping cost −20%; 15+ new markets; +40% global orders; 40+ countries','“Shipping abroad is too expensive.”'],
          ['10','Shipping, Sardarji Papadwale','1,000+ daily orders nationwide (no cost figure)','“My food business is too small and local.”']]},
   {type:'watch', title:'Rules for quoting numbers, and the stability question',
    body:'<b>(1)</b> Say who reported it: “Shiprocket’s own case study says…” — most are vendor-published. <b>(2)</b> Give the period and brand type. <b>(3)</b> Never promise the same result: “brands like yours have seen…”. <b>(4)</b> Admit gaps: Cases 1–4 don’t name the brand; Cases 5 and 10 give no starting number.<br><br>On <b>“Will you still be here?”</b> give the real picture: listed on NSE and BSE on 19 August 2026; revenue from operations ₹2,024 crore in FY26; net loss ₹79 crore (EBITDA ≈ −₹17 crore), much smaller than FY24; largest in its category by FY25 revenue (Redseer).'},
   {type:'text', title:'Think it through: two cases, two objections, two questions',
    body:'For a <b>COD-heavy beauty brand</b>: Case 1 answers “COD is killing us and I can’t stop COD”. Ask: <i>“What is your RTO rate on COD orders, and do you treat every COD order the same today?”</i> For a <b>regional food brand</b>: Case 10 answers “we’re too small and local”. Ask: <i>“Which regions do you turn orders away from today, and why?”</i>'}],

 buyers:{eyebrow:'Section 04 · Reckoner §07–08', title:'Buyers & Competitors',
  sub:'Four buyer roles, five rivals, a price table that misleads, and honest weaknesses',
  steps:[
   {type:'table', title:'The four buyer types',
    head:['Role','Titles','Focus','Core question'],
    rows:[['<b>Economic</b>','Founder, CEO, CFO','Order growth, blended cost per shipment, margin','“Will this protect my margin, or is it another tool subscription?”'],
          ['<b>User</b>','Ops manager, logistics lead, warehouse / fulfilment manager','Shipment execution, NDR resolution, team productivity','“Will this make my day easier, or is it one more dashboard to babysit?”'],
          ['<b>Technical</b>','CTO, IT head, product manager','Integration reliability, data security, API uptime','“Will this break our stack, or leave us with unreliable shipment data?”'],
          ['<b>Employee</b> (influencer)','Warehouse staff, packers, ops executives','Daily usability','A clunky day one becomes the renewal-time story']]},
   {type:'table', title:'What to pitch each buyer',
    head:['Buyer','Pitch'],
    rows:[['Economic','ROI of RTO reduction: pre-delivery confirmation cuts RTO by several points, protecting margin on every COD order'],
          ['Economic','From manual booking to an automated multi-courier panel as volume grows, without adding headcount'],
          ['User','CORE auto-selection — no more comparing rates shipment by shipment'],
          ['User','One dashboard for Shopify, Amazon and website orders instead of switching tabs'],
          ['User','Automated NDR workflows instead of calling the courier for every failed delivery'],
          ['Technical','Native integrations: Shopify, WooCommerce, Magento, Amazon and 12+ more'],
          ['Technical','Webhooks pushing real-time status into the brand’s OMS or warehouse system'],
          ['Technical','The August 2026 listing as proof of financial and operational stability']]},
   {type:'text', title:'Think it through: opening by buyer, and who raises RTO first',
    body:'<b>Founder:</b> open on margin — <i>“How much margin do you lose each month to parcels that come back?”</i> <b>Ops manager:</b> open on effort — <i>“How many hours a week does your team spend on labels, uploads and chasing couriers?”</i> <b>CTO:</b> open on risk — <i>“What is your order source of truth, and how do shipment updates reach it today?”</i><br><br>The <b>ops / logistics manager</b> usually raises RTO first, unprompted, because they handle every failed delivery and NDR call. The founder feels RTO in the P&amp;L but often describes it as “margins” or “returns”.'},
   {type:'table', title:'Competitors and counter-positioning',
    head:['Competitor','Primary strength','Shiprocket’s counter'],
    rows:[['NimbusPost','Lowest headline rate (≈ ₹19 / 500 g at top tier), 27+ carriers','A lower headline rate rarely survives your real RTO and weight-dispute load; CORE and scale lower your <b>true blended cost</b>'],
          ['Shyplite','AI dashboard, 16+ couriers, fast onboarding','A lighter platform has a smaller courier bench; 42+ couriers give more fallback at scale'],
          ['iThink Logistics','No minimum volume, structured NDR process','Past a few hundred shipments you’ll want Fulfillment, Checkout and financing under one partner'],
          ['ClickPost / Shipsy','Bring-Your-Own-Account on your own carrier contracts','BYOA makes sense once you negotiate carriers yourself; aggregated volume gets enterprise-grade rates without that'],
          ['Delhivery (direct)','No intermediary; better rates at high volume','Direct means one courier’s PIN map and pricing, with no fallback; Shiprocket shops several couriers and keeps the tech layer']]},
   {type:'table', title:'Comparative pricing (entry rate per 500 g, before GST)',
    head:['Platform','Entry rate','Fee','Minimum','Note'],
    rows:[['Shiprocket','₹45 / ₹41 / ₹39 / ₹36 (same city)','Lite free · ₹199 · ₹499 · ₹799','None on Lite','Zone E up to ₹97–₹136 on Lite; COD ₹34–₹56'],
          ['NimbusPost','₹25.50 · ₹24 · ₹19','No monthly fee','Elite (₹19) needs 1,000+ orders','Early COD 0–2% extra'],
          ['Shipway','From ₹19, prepaid wallet','Software separate (e.g. US$39.99 / 1,200)','None stated','Early remittance from D+2'],
          ['iThink Logistics','≈ ₹20–22; card ₹38.50–₹51.50','Rates after login','No minimum','Fuel, COD, RTO after login'],
          ['Shipyaari','₹28 · ₹27 · ₹26','₹299 · ₹599 · ₹999','None stated','Sept 2026'],
          ['Vamaship','≈ ₹22','Pay as you go','No minimum','Mar 2026'],
          ['Delhivery direct','Negotiated, ~10–20% below aggregators at scale','Contract','Best at 5,000+/mo','One network, no fallback'],
          ['ClickPost','Software ≈ ₹2–3 per shipment','Custom; pay couriers yourself','Suits 500+ orders/day','BYOA']]},
   {type:'watch', title:'How to read the price table',
    body:'<b>A low headline rate is not the final cost</b> — weight slab, zone, COD fee, RTO, discrepancies and GST all add on. <b>Compare like with like</b>: same weight, same top PIN codes, same COD share, on each platform. <b>Volume changes the price</b> — the best rates need Pro/Enterprise or NimbusPost’s 1,000+ orders. <b>Sources disagree</b>, and ClickPost and ShipPrime are competitors, so treat their numbers as claims. (Note: Shiprocket’s Zone E figure here, ₹97–₹136, differs from the zone table’s ₹25–₹167 — another reason to quote from the live card.)'},
   {type:'table', title:'Strengths and weaknesses',
    head:['Strengths','Weaknesses (acknowledge honestly)'],
    rows:[['Largest aggregator scale in India → courier leverage and a wider fallback network','Public reviews cite support-ticket delays and weight-discrepancy disputes at scale'],
          ['Full stack: shipping, fulfilment, checkout, marketing and financing under one login','Aggregator, not owned fleet — a weak courier in a region still hurts sellers there'],
          ['Publicly listed since August 2026 → longevity','Tiered pricing feels opaque: true landed cost is above the advertised floor'],
          ['Free entry tier removes the barrier to trying it','—']]},
   {type:'text', title:'Think it through: handling a named competitor',
    body:'Expect <i>“NimbusPost is cheaper”</i>, <i>“Why not go direct to Delhivery?”</i>, <i>“We already use ClickPost”</i> and <i>“I read bad reviews about your support.”</i> <b>Don’t criticise the rival.</b> Acknowledge its real strength, then move to a like-for-like comparison of <b>landed cost per delivered order</b> on the buyer’s own weights, PIN codes and COD share. Where Shiprocket is weak (support at scale, disputes), say so and explain what reduces it.'}],

 selling:{eyebrow:'Section 05 · Reckoner §09–11', title:'FAQs, Discovery & ROI',
  sub:'Concern → feature, eleven situation questions, and a value story that survives a CFO',
  steps:[
   {type:'text', title:'Concerns are often not said directly',
    body:'A buyer rarely says “my RTO is 25%”. They say “margins are terrible” or “returns are out of control”. <b>Diagnose the worry, then answer with the one feature built for it.</b>'},
   {type:'table', title:'The ten FAQs',
    head:['Buyer concern','Feature that answers it'],
    rows:[['“I only ship a handful a week — no logistics company will bother with me.”','Free <b>Lite</b> plan: no minimum volume, no lock-in'],
          ['“Every courier has PIN codes it won’t deliver to.”','<b>42+ couriers</b> on one panel, <b>19,000+ PIN codes</b>'],
          ['“I don’t know which courier is cheapest or fastest.”','<b>CORE</b>, the AI Courier Recommendation Engine'],
          ['“RTO is killing my margins and I don’t know why.”','<b>Engage 360</b> pre-delivery WhatsApp/SMS confirmation'],
          ['“I sell on three channels; keying in orders is a nightmare.”','<b>Native integrations</b>: Shopify, WooCommerce, Amazon + 12 more'],
          ['“I keep getting billed for ‘weight discrepancy’.”','Transparent <b>volumetric formula</b>; on Fulfillment, near-zero discrepancy claims'],
          ['“I have no warehouse; I ship from my living room.”','<b>Shiprocket Fulfillment</b>: 35+ warehouses, storage + pick-pack'],
          ['“I’ve started getting orders from abroad.”','<b>Shiprocket X</b>: 220+ countries'],
          ['“My checkout is slow; I lose customers at the cart.”','<b>Shiprocket Checkout (Fastrr)</b>: sub-40-second one-click checkout'],
          ['“I need cash for festive stock without raising equity.”','<b>Shiprocket Capital</b>: revenue-based financing on shipment data']]},
   {type:'text', title:'Think it through: the FAQs in plain language for a first-time Instagram seller',
    body:'<b>Small volume:</b> “It’s free to start; ship one parcel or a thousand.” <b>PIN codes:</b> “We use many delivery companies, so if one doesn’t go there, another does.” <b>Which courier:</b> “The system picks the best one for each parcel.” <b>RTO:</b> “Before shipping, we WhatsApp the buyer to confirm, so fewer parcels come back.” <b>Many channels:</b> “Orders from your website and Amazon show up in one place automatically.” <b>Weight charges:</b> “Couriers charge for box size too — a smaller box saves money.” <b>No warehouse:</b> “We can store and pack for you.” <b>Abroad:</b> “We ship overseas too.” <b>Slow checkout:</b> “Buyers can pay in one tap.” <b>Cash:</b> “We can lend against your sales history.”'},
   {type:'table', title:'Discovery (situation) questions, grouped by what they uncover',
    head:['Uncovers','Question'],
    rows:[['Volume and growth','“How many orders do you ship each month, and how will that change over 6–12 months?”'],
          ['Channels','“Which channels do you sell on — own website, Shopify, Amazon, Flipkart, Instagram/WhatsApp?”'],
          ['Current set-up','“Do you book through an aggregator, go direct to one courier, or book manually?”'],
          ['COD exposure','“What share of your orders are COD versus prepaid?”'],
          ['RTO pain','“Roughly what RTO or NDR rate do you see on COD orders?”'],
          ['Recent incidents','“Any recent lost shipment, weight-discrepancy charge or delayed COD remittance?”'],
          ['Footprint','“Do you ship from one location or several cities or warehouses?”'],
          ['Manual effort','“How much time does your team spend each week tracking, printing labels or chasing couriers?”'],
          ['Cross-border','“Any orders from outside India now, or planned?”'],
          ['Sizing the gain','“If we cut your RTO and blended cost per shipment, what would that do to monthly margin?”'],
          ['Why now','“What’s driving you to look now — rising costs, RTO pain, a new channel, outgrowing manual booking?”']]},
   {type:'text', title:'Think it through: only 2–3 questions with a busy founder',
    body:'Ask (1) <b>“What’s driving you to look at a shipping platform right now?”</b> — the buyer names the pain; (2) <b>“How many orders a month, and what share are COD?”</b> — qualifies volume and exposure; (3) <b>“Roughly what RTO do you see on COD orders?”</b> — this gives you the number that turns into rupees. Translate into Hindi, Marathi or Tamil when it helps.'},
   {type:'table', title:'ROI baseline: TrendKart (fictional)',
    head:['Input','Value'],
    rows:[['Monthly shipments','600, booked with one local courier'],['Average shipping cost','₹58 per shipment'],
          ['RTO','22% of COD orders; COD = 65% of orders'],['Manual tracking and labels','12 hours / month'],
          ['Weight disputes','≈ 8% of shipments, 45 minutes each']]},
   {type:'table', title:'The four value lines — with the RTO line corrected',
    head:['Line','Calculation','Reckoner shows','Correct value'],
    rows:[['1 Lower blended cost','(₹58 − ₹48) × 600','₹6,000','₹6,000'],
          ['2 Fewer RTO losses','(22% − 15%) × 390 COD × ₹90','₹24,570','<b>₹2,457</b>'],
          ['3 Ops time saved','8 hrs × ₹400','₹3,200','₹3,200'],
          ['4 Fewer weight disputes','(8% − 3%) × 600 × 0.75 hr × ₹400','₹9,000','₹9,000'],
          ['<b>Total</b>','against a ₹499 Advanced fee','≈ ₹42,770','<b>≈ ₹20,657</b>']]},
   {type:'watch', title:'The reckoner’s RTO line is ten times too high',
    body:'<b>0.07 × 390 × ₹90 = ₹2,457, not ₹24,570.</b> That one slip doubles the headline total (₹42,770 vs a correct ≈ ₹20,657). If a question uses the reckoner’s own figure, recognise it; if you build a value story for a buyer, <b>re-run every line</b> — one caught error discredits the whole model. Two other notes: the “86 failed parcels” are 600 × 0.65 × 0.22 = 85.8; and at 600 shipments the ₹499 Advanced fee is refunded (the threshold is 500), so the fee is not even a cost here. Even corrected, the value story is strong.'},
   {type:'calc', calc:'roi', title:'Live: rebuild the value story with a buyer’s numbers'},
   {type:'text', title:'Think it through: what a sceptical buyer challenges, and how to get real numbers',
    body:'A sceptic pushes hardest on the <b>blended-rate drop (₹58 → ₹48)</b> and the <b>RTO fall (22% → 15%)</b>, because both depend on the buyer’s own lanes and customers. Get real numbers in one call: ask them to open their current courier invoice for last month (total spend ÷ shipments = real cost per parcel), and their order report (COD orders, and how many came back). If they won’t share, price five of their real PIN codes live on the rate card and propose a 30-day pilot on COD orders to measure the RTO change.'}],

   {type:'text', title:'Think it through: small D2C vs large omni-channel retailer',
    body:'A <b>small D2C brand</b> arrives through free tools, the Shopify App Store, SEO and founder referrals — self-serve, triggered by a signup or install. A <b>large omni-channel retailer</b> comes through case studies, referrals from large accounts and outbound — triggered by a demo request. <b>The same trigger should not qualify both</b>: a Lite signup from a 3-person brand is a real buying signal, while one from an enterprise is usually one curious employee and still needs MEDDIC-style qualification.'},
   {type:'table', title:'The seven pipeline stages',

   {type:'text', title:'Think it through: where to be most hands-on',
    body:'Be most hands-on at <b>Proposal & Negotiation</b>: the weakest step (40–50%) leaks on sticker shock, which a rep prevents by modelling landed cost on the buyer’s own weights, zones and COD share. The stage most likely to <b>stall without a proactive rep</b> is <b>Technical Onboarding</b> — channel connection, pickup verification and COD KYC sit with the seller’s team, so nothing ships until someone chases it, even though the deal looks won.'}],

/* ───────────── 08 · LIFECYCLE, HEALTH & CADENCE (reckoner §15–17) ───────────── */
 kam:{eyebrow:'Section 08 · Reckoner §15–17', title:'Lifecycle, Health & Cadence',
  sub:'Running the account after the deal: four stages, a weighted index, tiers and escalation',
  steps:[
   {type:'text', title:'Why key account management matters here',
    body:'<b>Closing is the start of the revenue relationship.</b> A live Shiprocket account runs on autopilot — shipments keep booking and couriers keep delivering — so it is easy for a KAM to go quiet until the seller notices a rising RTO, a cost spike, or a competitor’s pitch. These are teaching frameworks from general KAM practice, not documented Shiprocket processes.'},
   {type:'table', title:'The four-stage lifecycle',
    head:['Stage','When','Goal'],
    rows:[['1 Onboarding & Activation','Days 0–30','Every channel connected, first bulk shipment booked, seller comfortable in the dashboard. <b>A smooth first shipment and a smooth first RTO resolution are the two biggest early trust-builders.</b>'],
          ['2 Steady-State Servicing','Months 1–9','Monitor volume trend, RTO trend and plan utilisation; check in even when nothing is wrong'],
          ['3 Renewal Preparation','30–60 days before plan review','Usage and results review — volume, RTO trend, savings vs the prior set-up — from the seller’s own Analytics; raise expansion'],
          ['4 Expansion & Advocacy','Post-renewal','Follow up upsell commitments; ask for a reference or case study']]},
   {type:'text', title:'Think it through: where accounts are lost',
    body:'Accounts are most likely lost in <b>Steady-State Servicing</b>, with the decision landing at renewal. Shipments run without anyone watching, RTO creeps up unnoticed, and a cheaper headline rate (NimbusPost, a direct Delhivery deal) gets a hearing. It is also the stage KAMs spend the <b>least</b> time on, because nothing looks broken. Onboarding gets attention because it is urgent, and renewal because it is visible.'},
   {type:'table', title:'The Account Health Index',
    head:['Category','Weight','Tells you','Example sub-metrics'],
    rows:[['Commercial Health','30%','Is shipping and add-on spend growing or shrinking?','Volume trend, plan-tier trend, Fulfillment/Checkout/Capital revenue'],
          ['Usage & Adoption','30%','Is the seller using the platform as intended?','Channels connected, % of orders booked via dashboard vs manual, feature adoption'],
          ['Delivery & Automation Performance','25%','Is the core service moment — delivery — going well?','RTO trend, NDR resolution time, weight-dispute rate, on-time delivery'],
          ['Relationship','15%','Is the relationship healthy?','Responsiveness to KAM outreach, ticket sentiment, stakeholders engaged']]},
   {type:'formula', pill:'Health = 0.30·Commercial + 0.30·Usage + 0.25·Delivery + 0.15·Relationship',
    legend:[['Scoring','sub-metrics Red 0 / Yellow 1 / Green 2, averaged per category, scaled to 100'],
            ['Bands','<b>80–100 Thriving · 60–79 Stable · 40–59 At Watch · below 40 At Risk</b>'],
            ['Worked example','26.4 + 24.6 + 13.75 + 2.25 = <b>67 Stable</b> (88 / 82 / 55 / 15)']]},
   {type:'watch', title:'The blended number hides two warnings',
    body:'In the worked example the account is “comfortably Stable” at 67, yet <b>Relationship is Red at 15</b> (three ignored check-ins) and <b>Delivery is Yellow at 55</b> because RTO has crept up for two months unexplained. A KAM reading only the total files it as healthy — until the seller quietly migrates to another aggregator. <b>The category breakdown, not the blended score, triggers action.</b>'},
   {type:'calc', calc:'health', title:'Live: score an account and read the escalation'},
   {type:'text', title:'Think it through: which category to check first',
    body:'Check <b>Relationship</b> first — it is the leading indicator. Commercial and usage scores describe what already happened; a contact who ignores three check-ins predicts what happens at renewal. Then look at <b>Delivery</b>, because the unexplained RTO rise is the early warning the reckoner says nobody investigated. The blended 67 misleads because two strong Greens carrying 60% of the weight bury the two weak categories.'},
   {type:'table', title:'Cadence by tier (monthly shipment volume)',
    head:['Tier','Profile','Live touchpoint','QBR','Who initiates'],
    rows:[['Enterprise','2,500+ / month; custom rate card','Monthly check-in, minimum','Quarterly, formal, multi-stakeholder','KAM, proactively'],
          ['Growth','300–1,000 / month (Pro)','As needed, growth-driven','Quarterly','KAM, proactively'],
          ['Core','60–300 / month (Basic / Advanced)','Quarterly, relationship-focused','Biannual, informal','KAM, proactively'],
          ['Self-Serve / Long Tail','Under 60 / month (Lite)','None by default','Automated in-app or email summary','System-triggered only']]},
   {type:'watch', title:'The tier table doesn’t match the plan table',
    body:'Cadence puts Pro at 300–1,000 shipments, but the pricing page lists Pro for 3,000–10,000 orders. It puts Lite under 60, but the pricing page lists Lite for up to 5. And nothing covers 1,000–2,500. For questions, <b>use the cadence table’s numbers when asked about cadence</b>, and the pricing table’s numbers when asked about plans.'},
   {type:'table', title:'The 3-level escalation ladder',
    head:['Level','Trigger','Who, how fast'],
    rows:[['Level 1','Account drops into <b>At Watch</b> (“Yellow”)','KAM personal response within <b>24 hours</b>'],
          ['Level 2','Account drops into <b>At Risk</b> (“Red”)','Team Lead or Regional Manager joins the next call within <b>48 hours</b>'],
          ['Level 3','<b>Growth or Enterprise</b> + Red-band signals + <b>active competitor threat</b>','<b>Business Head</b>, authorised to approve a bounded concession (e.g. a one-time RTO-charge waiver)']]},
   {type:'text', title:'Think it through: should a Long Tail account ever get a human?',
    body:'Yes — when a signal makes the default wrong. The best single trigger is <b>volume crossing toward the next tier</b> (the outbound volume-threshold method): that seller is about to become Core and a call converts the upgrade. The defensive version is a sudden volume drop or an RTO spike just before a plan review. Otherwise, live calls cost more than the account returns.'}],
  check:[
   {t:'kam',tag:'calc',diff:'medium',
    q:'Commercial 70, Usage 60, Delivery 40, Relationship 80. What is the index and band?',

const CALCS={
 landed:{
  hint:'Enter the packed parcel and the rate-card numbers. The courier bills the higher weight, rounded up to the next 500 g slab.',
  ins:[{k:'dw',nm:'Dead weight (kg)',type:'number',def:1},
       {k:'l',nm:'Length (cm)',type:'number',def:20},{k:'b',nm:'Breadth (cm)',type:'number',def:20},{k:'h',nm:'Height (cm)',type:'number',def:20},
       {k:'f1',nm:'First 500 g ₹',type:'number',def:53},{k:'fx',nm:'Each extra 500 g ₹',type:'number',def:52},
       {k:'cod',nm:'COD order?',type:'select',opts:[['y','Yes'],['n','No (prepaid)']],def:'y'},
       {k:'cf',nm:'COD fee ₹',type:'number',def:48}],
  run:v=>{
    const vol=(+v.l)*(+v.b)*(+v.h)/5000, cw=Math.max(+v.dw||0,vol), slabs=Math.max(1,Math.ceil(cw/0.5-1e-9));
    const fr=(+v.f1)+(slabs-1)*(+v.fx), cod=v.cod==='y'?(+v.cf):0, pre=fr+cod, tot=pre*1.18;
    const dslabs=Math.max(1,Math.ceil((+v.dw||0)/0.5-1e-9)), dtot=((+v.f1)+(dslabs-1)*(+v.fx)+cod)*1.18;
    return 'Volumetric = '+v.l+'×'+v.b+'×'+v.h+' ÷ 5000 = '+vol.toFixed(2)+' kg\nChargeable = max('+(+v.dw).toFixed(2)+', '+vol.toFixed(2)+') = '+cw.toFixed(2)+' kg → '+slabs+' slabs\nFreight    = '+inr(+v.f1)+' + '+(slabs-1)+' × '+inr(+v.fx)+' = '+inr(fr)+
      '\n+ COD      = '+inr(pre)+'\n× 1.18 GST'+
      '<span class="big">≈ '+inr(tot)+' per parcel</span>'+
      (vol>(+v.dw)?'<span class="vd warn">Billed on volume, not weight: '+inr(tot-dtot)+' more than dead weight alone. A smaller box is the cheapest saving.</span>':'<span class="vd ok">Billed on dead weight; the box size is not costing extra.</span>');}},

 bill:{
  hint:'A monthly estimate before you quote a plan. Plan fees are refunded at 100 / 500 / 1,000 shipments.',
  ins:[{k:'plan',nm:'Plan',type:'select',opts:[['lite','Lite (free)'],['biz','Business ₹199'],['adv','Advanced ₹499'],['pro','Pro ₹799']],def:'adv'},
       {k:'n',nm:'Parcels / month',type:'number',def:400},
       {k:'fr',nm:'Average freight ₹ / parcel',type:'number',def:70},
       {k:'cs',nm:'COD share %',type:'range',min:0,max:100,step:5,def:60},
       {k:'cf',nm:'COD fee ₹',type:'number',def:45},
       {k:'rto',nm:'RTO % of COD orders',type:'range',min:0,max:40,step:1,def:0},
       {k:'rf',nm:'Return-leg freight ₹ / RTO',type:'number',def:70}],
  run:v=>{
    const P={lite:[0,0],biz:[199,100],adv:[499,500],pro:[799,1000]}[v.plan];
    const n=+v.n||0, codN=n*v.cs/100, freight=n*(+v.fr), codFee=codN*(+v.cf), rtoN=codN*v.rto/100, rto=rtoN*(+v.rf);
    const refunded=P[1]&&n>=P[1], fee=refunded?0:P[0], pre=freight+codFee+rto, gst=pre*0.18;
    return 'Freight   '+num(n)+' × '+inr(+v.fr)+' = '+inr(freight)+'\nCOD fees  '+num(codN)+' × '+inr(+v.cf)+' = '+inr(codFee)+
      (rto?'\nRTO legs  '+num(rtoN)+' × '+inr(+v.rf)+' = '+inr(rto):'')+'\nGST 18%   = '+inr(gst)+'\nPlan fee  = '+inr(P[0])+(refunded?' (refunded at '+num(P[1])+'+)':'')+
      '<span class="big">≈ '+inr(pre+gst+fee)+' / month</span>'+
      (P[1]&&!refunded?'<span class="vd warn">'+num(P[1]-n)+' more shipments would get the '+inr(P[0])+' fee refunded.</span>':'<span class="vd ok">Plan fee is not a cost at this volume.</span>');}},

 roi:{
  hint:'Defaults are TrendKart. The RTO line is computed correctly here (₹2,457, not the ₹24,570 printed in the source).',
  ins:[{k:'n',nm:'Shipments / month',type:'number',def:600},
       {k:'c0',nm:'Current cost ₹ / shipment',type:'number',def:58},{k:'c1',nm:'New blended cost ₹',type:'number',def:48},
       {k:'cs',nm:'COD share %',type:'range',min:0,max:100,step:5,def:65},
       {k:'r0',nm:'RTO now %',type:'range',min:0,max:40,step:1,def:22},{k:'r1',nm:'RTO after %',type:'range',min:0,max:40,step:1,def:15},
       {k:'rc',nm:'₹ wasted per RTO',type:'number',def:90},
       {k:'oh',nm:'Ops hours saved / month',type:'number',def:8},{k:'w',nm:'Ops wage ₹ / hour',type:'number',def:400},
       {k:'d0',nm:'Disputes now %',type:'range',min:0,max:20,step:1,def:8},{k:'d1',nm:'Disputes after %',type:'range',min:0,max:20,step:1,def:3},
       {k:'dm',nm:'Minutes per dispute',type:'number',def:45}],
  run:v=>{
    const n=+v.n||0, cod=n*v.cs/100;
    const l1=((+v.c0)-(+v.c1))*n, l2=((v.r0-v.r1)/100)*cod*(+v.rc), l3=(+v.oh)*(+v.w), l4=((v.d0-v.d1)/100)*n*((+v.dm)/60)*(+v.w);
    const tot=l1+l2+l3+l4, big=[['blended cost',l1],['RTO',l2],['ops time',l3],['disputes',l4]].sort((a,b)=>b[1]-a[1])[0];
    return '1 Blended cost  ('+v.c0+' − '+v.c1+') × '+num(n)+' = '+inr(l1)+
      '\n2 RTO           ('+v.r0+'% − '+v.r1+'%) × '+num(cod)+' COD × '+inr(+v.rc)+' = '+inr(l2)+
      '\n3 Ops time      '+v.oh+' hrs × '+inr(+v.w)+' = '+inr(l3)+
      '\n4 Disputes      ('+v.d0+'% − '+v.d1+'%) × '+num(n)+' × '+v.dm+' min × '+inr(+v.w)+'/hr = '+inr(l4)+
      '<span class="big">≈ '+inr(tot)+' / month</span>'+
      '<span class="vd">Largest line: '+big[0]+' ('+pct(tot?big[1]/tot:0,0)+' of the total). That is the assumption a sceptical buyer will test first — get their real number for it.</span>';}},

 funnel:{
  hint:'Benchmark mid-points by default. Move one rate at a time and see which leak costs the most deals.',
  ins:[{k:'leads',nm:'Leads captured',type:'number',def:1000},
       {k:'a',nm:'Lead → SQL %',type:'range',min:20,max:60,step:1,def:40},
       {k:'b',nm:'SQL → Demo %',type:'range',min:50,max:95,step:1,def:75},
       {k:'c',nm:'Demo → Proposal %',type:'range',min:30,max:80,step:1,def:55},
       {k:'d',nm:'Proposal → Onboarding %',type:'range',min:25,max:70,step:1,def:45},

  run:v=>{
    const names=['SQL','Demo','Proposal','Onboarding','Won'],r=[v.a,v.b,v.c,v.d,v.e];
    let x=+v.leads,lines='Leads      '+Math.round(x);
    r.forEach((p,i)=>{x=x*p/100;lines+='\n'+(names[i]+'          ').slice(0,10)+' '+x.toFixed(1)+'   ('+p+'%)';});

    return lines+'<span class="big">≈ '+Math.round(x)+' sellers won</span>'+
      '<span class="vd warn">Weakest post-SQL step: '+post[0]+' at '+post[1]+'%.</span>';}},

 ndr:{
  hint:'Every NDR that is not delivered on reattempt becomes an RTO. Raise the reattempt rate and watch RTO fall.',
  ins:[{k:'s',nm:'Shipments / month',type:'number',def:2000},
       {k:'ndr',nm:'NDR rate %',type:'range',min:0,max:40,step:1,def:15},
       {k:'r0',nm:'Reattempt → delivered today %',type:'range',min:0,max:100,step:5,def:40},
       {k:'r1',nm:'With automated NDR %',type:'range',min:0,max:100,step:5,def:65},
       {k:'c',nm:'₹ wasted per RTO',type:'number',def:90}],
  run:v=>{
    const s=+v.s||0, nd=s*v.ndr/100, rto0=nd*(1-v.r0/100), rto1=nd*(1-v.r1/100), d=rto0-rto1;
    return 'NDR cases  = '+num(nd)+'\nRTO today  = '+num(rto0)+'  ('+pct(s?rto0/s:0,2)+')\nRTO after  = '+num(rto1)+'  ('+pct(s?rto1/s:0,2)+')'+

 health:{
  hint:'Category scores out of 100 (Red 0 · Yellow 50 · Green 100). Add tier and competitor to see the escalation.',
  ins:[{k:'c',nm:'Commercial Health (30%)',type:'range',min:0,max:100,step:5,def:88},
       {k:'u',nm:'Usage & Adoption (30%)',type:'range',min:0,max:100,step:1,def:82},
       {k:'d',nm:'Delivery & Automation (25%)',type:'range',min:0,max:100,step:5,def:55},
       {k:'r',nm:'Relationship (15%)',type:'range',min:0,max:100,step:5,def:15},
       {k:'tier',nm:'Tier',type:'select',opts:[['ent','Enterprise'],['gro','Growth'],['core','Core'],['tail','Long Tail']],def:'gro'},
       {k:'comp',nm:'Active competitor threat?',type:'select',opts:[['n','No'],['y','Yes']],def:'n'}],
  run:v=>{
    const s=0.3*v.c+0.3*v.u+0.25*v.d+0.15*v.r;
    const band=s>=80?['ok','Thriving']:s>=60?['ok','Stable']:s>=40?['warn','At Watch']:['bad','At Risk'];
    const weak=[['Commercial',v.c],['Usage',v.u],['Delivery',v.d],['Relationship',v.r]].filter(x=>x[1]<40).map(x=>x[0]);
    let esc='No band escalation.';
    if(band[1]==='At Watch')esc='Level 1: KAM personal response within 24 hours.';
    if(band[1]==='At Risk')esc=((v.tier==='ent'||v.tier==='gro')&&v.comp==='y')?'Level 3: Business Head, bounded concession (e.g. one-time RTO-charge waiver).':'Level 2: Team Lead / RM on the next call within 48 hours.';
    return '0.30×'+v.c+' + 0.30×'+v.u+' + 0.25×'+v.d+' + 0.15×'+v.r+
      '\n= '+(0.3*v.c).toFixed(1)+' + '+(0.3*v.u).toFixed(1)+' + '+(0.25*v.d).toFixed(2)+' + '+(0.15*v.r).toFixed(2)+
      '<span class="big">'+s.toFixed(1)+' · '+band[1]+'</span>'+
      '<span class="vd '+band[0]+'">'+esc+'</span>'+
      (weak.length?'<span class="vd bad">Hidden Red: '+weak.join(', ')+'. The breakdown, not the total, triggers action.</span>':'<span class="vd ok">No category in the Red zone.</span>');}},

 nrr:{
  hint:'Subscription and add-on revenue only. Free accounts that existed at the start count as ₹0 start; their upgrades are expansion.',
  ins:[{k:'s',nm:'Starting revenue ₹ / mo',type:'number',def:11000},
       {k:'e',nm:'Expansion ₹ (incl. free → paid)',type:'number',def:4100},
       {k:'c',nm:'Churn + downgrades ₹',type:'number',def:5000},
       {k:'n',nm:'New sign-ups ₹ (excluded)',type:'number',def:0}],
  run:v=>{
    if(!+v.s)return 'Starting revenue cannot be zero.';
    const nrr=((+v.s)+(+v.e)-(+v.c))/(+v.s), wrong=((+v.s)+(+v.e)-(+v.c)+(+v.n))/(+v.s);
    return 'NRR = ('+inr(+v.s)+' + '+inr(+v.e)+' − '+inr(+v.c)+') ÷ '+inr(+v.s)+
      '<span class="big">'+pct(nrr)+'</span>'+
      '<span class="vd '+(nrr>=1?'ok':'bad')+'">'+(nrr>=1?'The existing book is growing even with zero new sign-ups.':'The existing base is shrinking. New sign-ups can hide this, but cannot fix it.')+'</span>'+
      ((+v.n)?'<span class="vd warn">Counting new sign-ups would show '+pct(wrong)+'. That is the wrong number.</span>':'');}},

 cltv:{
  hint:'Tenure is in years, so the ×12 stays in the formula.',
  ins:[{k:'m',nm:'Avg monthly revenue ₹',type:'number',def:2500},
       {k:'g',nm:'Gross margin %',type:'range',min:20,max:90,step:1,def:55},
       {k:'t',nm:'Tenure (years)',type:'range',min:0.5,max:6,step:0.5,def:1.5},
       {k:'k',nm:'Proposed concession ₹ (one-off)',type:'number',def:2000}],
  run:v=>{
    const c=(+v.m)*12*(v.g/100)*v.t, sh=c?(+v.k)/c:0;
    return inr(+v.m)+' × 12 × '+(v.g/100).toFixed(2)+' × '+v.t+
      '<span class="big">CLTV '+inr(c)+'</span>'+
      '<span class="vd '+(sh<0.15?'ok':sh<0.5?'warn':'bad')+'">The concession is '+pct(sh,0)+' of CLTV. '+(sh<0.15?'A small fraction — easy to justify if it saves the account.':sh<0.5?'Material — only if it clearly extends tenure.':'Close to the whole lifetime value — not justifiable.')+'</span>';}},

 sow:{
  hint:'The denominator includes Shiprocket itself, plus any other aggregator, in-house logistics, checkout or financing vendor.',
  ins:[{k:'a',nm:'Shiprocket revenue ₹ / mo',type:'number',def:3000},
       {k:'t',nm:'Total realistic spend ₹ / mo',type:'number',def:10000},
       {k:'g',nm:'Target share %',type:'range',min:5,max:95,step:1,def:50}],
  run:v=>{
    if(!+v.t)return 'Total spend cannot be zero.';
    const s=(+v.a)/(+v.t), tgt=(+v.t)*v.g/100, gap=tgt-(+v.a);
    return 'Share  = '+inr(+v.a)+' ÷ '+inr(+v.t)+'\nTarget = '+v.g+'% × '+inr(+v.t)+' = '+inr(tgt)+
      '<span class="big">'+pct(s)+' now · gap '+(gap>0?inr(gap):'none')+'</span>'+
      '<span class="vd '+(s<0.4?'ok':'warn')+'">'+(s<0.4?'Plenty of headroom: look for the other aggregator, in-house packing, checkout or financing lines Shiprocket could take.':'High share: growth now comes from the seller growing, not from taking wallet.')+'</span>';}},

const EXAM_MCQ=D_CASES.reduce((a,c)=>a+c.qs.filter(q=>!q.open).length,0);
const EXAM_OPEN=D_CASES.reduce((a,c)=>a+c.qs.filter(q=>q.open).length,0);
const CFG = typeof CONFIG!=='undefined'?CONFIG:{};
const OPENED={}, LEARNED={};
let quizState=null, examState=null, LESSON=D_TOPICS.length?D_TOPICS[0].id:null;
let SCOPE=CORE.length&&CORE.length<D_QUIZ.length?'core':'all', FOCUS=null, MISSED=[];

/* =========================================================================

function tableNode(t){
  const d=el('div','dtab');
  d.innerHTML=(t.cap?'<div class="cap">'+t.cap+'</div>':'')+
    '<div class="sc"><table><thead><tr>'+t.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    t.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="num"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
  return d;
}
function caseletNode(C){
  const d=el('div','caselet');d.id='case-'+C.id;
  d.innerHTML='<div class="cl">'+C.cl+'</div><h4>'+C.title+'</h4><div class="brief">'+C.brief+'</div>'+
    (C.facts?'<div class="facts">'+C.facts.map(f=>'<span>'+f+'</span>').join('')+'</div>':'');
  (C.tables||[]).forEach(t=>d.appendChild(tableNode(t)));
  return d;
}
function sceneNode(s){
  const d=el('div','casebox');
  d.innerHTML='<div class="cl">'+s.cl+'</div><h4>'+s.h+'</h4><p>'+s.body+'</p>';
  return d;
}
function mcqNode(Q,card,onScore){
  if(Q.match)return matchNode(Q,card,onScore);
  const box=el('div','mcq');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div>';
  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D','E'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}
/* a match-the-following question: Q.match=[[left,right],…], optional Q.cols=[leftHead,rightHead].
   Tap a left item, then a right item, to pair them; re-pair freely; Check scores it. */
const MATCH_COL=['#22d3ee','#a78bfa','#f472b6','#fbbf24','#34d399','#60a5fa','#fb923c','#e879f9'];
function matchNode(Q,card,onScore){
  const box=el('div','mtch');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag match">🔗 Match the following</span><span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div><div class="mt-help">Tap an item on the left, then its match on the right. Tap again to re-pair.</div>';
  const n=Q.match.length, letters='ABCDEFGH';
  const right=shuffle(Q.match.map((p,i)=>({t:p[1],i})));          // i = index of the left item it belongs to
  const pair=new Array(n).fill(-1);                                 // left index → position in right[]
  let selL=-1, selR=-1, done=false;
  const grid=el('div','mt-grid');
  const colL=el('div','mt-col'), colR=el('div','mt-col');
  if(Q.cols){colL.appendChild(el('div','mt-h',Q.cols[0]));colR.appendChild(el('div','mt-h',Q.cols[1]));}
  const LB=[],RB=[];
  const L=Q.match.map((p,i)=>{const b=el('button','mt-item','<span class="mt-k">'+(i+1)+'</span><span class="mt-t">'+p[0]+'</span>');const bd=el('span','mt-b');b.appendChild(bd);LB.push(bd);colL.appendChild(b);return b;});
  const R=right.map((r,j)=>{const b=el('button','mt-item','<span class="mt-k">'+letters[j]+'</span><span class="mt-t">'+r.t+'</span>');const bd=el('span','mt-b');b.appendChild(bd);RB.push(bd);colR.appendChild(b);return b;});
  grid.appendChild(colL);grid.appendChild(colR);box.appendChild(grid);
  const row=el('div','mt-row');
  const chk=el('button','btn btn-grad mt-chk','Check answers');chk.disabled=true;
  const rst=el('button','btn mt-rst','Reset');
  const cnt=el('span','mt-cnt','0 / '+n+' paired');
  row.appendChild(chk);row.appendChild(rst);row.appendChild(cnt);box.appendChild(row);
  function paint(){
    L.forEach((b,i)=>{const j=pair[i];
      b.className='mt-item'+(i===selL?' sel':'')+(j>=0?' on':'');
      b.style.setProperty('--pc',j>=0?MATCH_COL[i%MATCH_COL.length]:'transparent');
      LB[i].textContent=j>=0?letters[j]:'';});
    R.forEach((b,j)=>{const i=pair.indexOf(j);
      b.className='mt-item'+(j===selR?' sel':'')+(i>=0?' on':'');
      b.style.setProperty('--pc',i>=0?MATCH_COL[i%MATCH_COL.length]:'transparent');
      RB[j].textContent=i>=0?String(i+1):'';});
    const k=pair.filter(x=>x>=0).length;cnt.textContent=k+' / '+n+' paired';chk.disabled=k<n;
  }
  function tryPair(){
    if(selL<0||selR<0)return;
    const prev=pair.indexOf(selR);if(prev>=0)pair[prev]=-1;
    pair[selL]=selR;selL=-1;selR=-1;
  }
  L.forEach((b,i)=>b.onclick=()=>{if(done)return;selL=(selL===i?-1:i);tryPair();paint();});
  R.forEach((b,j)=>b.onclick=()=>{if(done)return;selR=(selR===j?-1:j);tryPair();paint();});
  rst.onclick=()=>{if(done)return;pair.fill(-1);selL=selR=-1;paint();};
  chk.onclick=e=>{
    if(done||chk.disabled)return;done=true;box.dataset.done='1';
    let right_=0;
    L.forEach((b,i)=>{const ok=right[pair[i]].i===i;if(ok)right_++;
      b.disabled=true;b.classList.add(ok?'good':'bad');
      if(!ok){const want=right.findIndex(r=>r.i===i);LB[i].textContent=letters[pair[i]]+' → '+letters[want];}});
    R.forEach(b=>b.disabled=true);chk.disabled=true;rst.disabled=true;
    const ok=right_===n;
    cnt.textContent=right_+' / '+n+' correct';
    onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
    const key=Q.match.map((p,i)=>(i+1)+'  '+p[0]+'  →  '+p[1]).join('\n');
    const why=el('div','why','<h5>'+(ok?'All matched →':right_+' of '+n+' right — the full key →')+'</h5><div class="work">'+key+'</div>'+(Q.why?'<p>'+Q.why+'</p>':''));
    box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
  };
  paint();
  return box;
}
/* a written question — used by the exam caselets and by the written paper */
function openNode(Q,label,idx,onOpen){
  const card=el('div','openq');
  card.innerHTML='<div class="oh"><span class="on">'+label+'</span><span class="om">'+(Q.marks||5)+' marks</span></div>'+
    '<div class="oq">'+Q.q+'</div>'+(Q.hint?'<p class="hint">💡 '+Q.hint+'</p>':'');
  const ansBox=el('div','ans');
  ansBox.innerHTML='<h5>Model answer</h5>'+(Q.svg&&typeof dsSvg==='function'?dsSvg(Q.svg):'')+Q.ans+
    (Q.rubric?'<div class="rub"><h6>Marking scheme — what the examiner wants</h6><ul>'+
      Q.rubric.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>':'');
  const btn=el('button','btn btn-grad btn-rev','Show model answer ↓');
  btn.onclick=()=>{
    const open=ansBox.classList.toggle('show');
    btn.textContent=open?'Hide model answer ↑':'Show model answer ↓';
    if(open&&!OPENED[idx]){OPENED[idx]=1;buildSidebar();onOpen&&onOpen();}
  };
  card.appendChild(btn);card.appendChild(ansBox);
  return card;
}

/* ---------- keyboard: answer the first unanswered question ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||'')))return;
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'5':4,'a':0,'b':1,'c':2,'d':3,'e':4};
  const idx=map[(e.key||'').toLowerCase()];
  if(idx===undefined)return;
  const box=[...document.querySelectorAll('.mcq')].find(b=>!b.dataset.done);
  if(!box)return;
  const btn=box.querySelectorAll('.opt')[idx];
  if(!btn||btn.disabled)return;
  e.preventDefault();
  btn.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});
  btn.click();
});

   MODE · EXAM PAPER
   ========================================================================= */
function renderExam(){
  const m=$('#main');m.innerHTML='';
  examState={answered:0,correct:0,total:EXAM_MCQ,traps:0,per:{},missed:[]};
  D_CASES.forEach(c=>examState.per[c.id]={c:0,n:c.qs.filter(q=>!q.open).length,a:0});
  const traps=D_CASES.reduce((a,c)=>a+c.qs.filter(q=>q.trap).length,0);
  const intro=el('div','card');
  intro.innerHTML='<div class="eyebrow">'+(CFG.examEyebrow||'Exam-pattern paper')+'</div>'+
    '<h1 class="tt">'+(CFG.examTitle||(D_CASES.length+' caselets, '+EXAM_MCQ+' questions'))+' ✍</h1>'+
    '<div class="sub">'+(CFG.examIntro||'Every question sits under a caselet with its own brief and data tables. Read the table before you read the options.')+'</div>'+
    (EXAM_OPEN?'<div class="sub" style="margin-top:10px">Plus <b>'+EXAM_OPEN+' open-ended written questions</b> with model answers and a marking scheme each.</div>':'')+
    '<div class="sub" style="margin-top:10px">Watch for <span class="tag trap" style="margin:0">🃏 tricky</span> — those '+traps+' turn on a distinction that is easy to get backwards. '+
    'Answer with the mouse or press <b>1–4</b> / <b>A–D</b>.</div>'+
    '<div class="srcrow">'+D_CASES.map(c=>'<span class="src">'+c.cl+'</span>').join('')+'</div>';
  m.appendChild(intro);
  let n=0,on=0;
  D_CASES.forEach(C=>{
    m.appendChild(caseletNode(C));
    C.qs.forEach(Q=>{
      if(Q.open){
        on++;
        m.appendChild(openNode(Q,'Written '+on+' / '+EXAM_OPEN,C.id+'-o'+on,
          ()=>{if(Object.keys(OPENED).length===EXAM_OPEN+D_PAPER.length)unlock('b_written');}));
      } else {
        n++;
        const card=el('div','qcard');
        card.appendChild(el('div','qnum','<span>Q'+n+' / '+EXAM_MCQ+'</span>'));
        card.appendChild(mcqNode(Q,card,ok=>{
          examState.answered++;examState.per[C.id].a++;
          if(ok){examState.correct++;examState.per[C.id].c++;if(Q.trap)examState.traps++;}
          else examState.missed.push(Q);
          const p=examState.per[C.id];
          if(p.a===p.n&&p.c===p.n)unlock('b_caselet');
          if(traps&&examState.traps===traps)unlock('b_trap');
          buildSidebar();updateFoot();}));
        m.appendChild(card);
      }
    });
  });
  const rc=el('div','card hidden');rc.id='resultsCard';m.appendChild(rc);
  buildFoot();buildSidebar();
}

/* =========================================================================
   MODE · PRACTICE QUIZ (drill)
   ========================================================================= */
function setScope(mode,id){
  if(mode==='topic'){SCOPE='topic';FOCUS=id; ACTIVE=D_QUIZ.filter(q=>q.t===id);}
  else if(mode==='missed'&&MISSED.length){SCOPE='missed';FOCUS=null; ACTIVE=MISSED.slice();}
  else if(mode==='all'){SCOPE='all';FOCUS=null; ACTIVE=D_QUIZ.slice();}
  else {SCOPE='core';FOCUS=null; ACTIVE=CORE.slice();}
  TRAPS=ACTIVE.filter(q=>q.trap).length;
  renderDrill();
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
function renderDrill(){
  const m=$('#main');m.innerHTML='';
  quizState={answered:0,correct:0,total:ACTIVE.length,traps:0,per:{},missed:[]};
  D_TOPICS.forEach(t=>quizState.per[t.id]={c:0,n:0,a:0});
  ACTIVE.forEach(q=>quizState.per[q.t]&&quizState.per[q.t].n++);
  const scopeName=FOCUS?(D_TOPICS.find(t=>t.id===FOCUS)||{}).name:null;
  const intro=el('div','card');
  intro.innerHTML='<div class="eyebrow">'+(FOCUS?'Focused practice · '+scopeName:(CFG.quizEyebrow||'Practice quiz'))+'</div>'+
    '<h1 class="tt">'+(FOCUS?scopeName+' 🎯':(CFG.quizTitle||'The full paper'))+' 📈</h1>'+
    '<div class="sub">'+(FOCUS
      ? 'Just this section — <b>'+ACTIVE.length+' questions</b>. Use the sidebar to switch sections or go back to the full run.'
      : '<b>'+ACTIVE.length+' questions</b> across '+D_TOPICS.length+' sections. '+(CFG.quizIntro||'Click any section in the sidebar to drill just that block.'))+'</div>'+
    '<div class="sub" style="margin-top:10px">The <b>Why</b> panel under each answer is the real revision — it carries the working and the trap that was being set. '+
    'Watch for <span class="tag trap" style="margin:0">🃏 tricky</span> — those '+TRAPS+' turn on a distinction that is easy to get backwards.</div>'+
    '<div class="sub" style="margin-top:10px">House rules: <b>no option is ever bolded</b>, and <b>the correct answer is never the longest option</b>. Positions reshuffle every attempt. '+
    'Answer with the mouse or press <b>1–4</b> / <b>A–D</b>.</div>'+
    '<div class="srcrow">'+D_TOPICS.map(t=>'<span class="src">'+t.name+'</span>').join('')+'</div>';
  m.appendChild(intro);
  let n=0;
  D_TOPICS.forEach((t,ti)=>{
    const qs=ACTIVE.filter(q=>q.t===t.id);if(!qs.length)return;
    const h=el('div','qgroup-h');h.id='grp-'+t.id;
    h.innerHTML='<span class="gi">'+String(ti+1).padStart(2,'0')+'</span><span class="gt">'+t.name+'</span><span class="gc">'+qs.length+' questions</span>';
    m.appendChild(h);
    let lastScene=null;
    qs.forEach(q=>{n++;
      if(q.scene&&q.scene!==lastScene){m.appendChild(sceneNode(q.scene));lastScene=q.scene;}
      if(!q.scene)lastScene=null;
      const card=el('div','qcard');
      card.appendChild(el('div','qnum','<span>Q'+n+' / '+ACTIVE.length+'</span>'));
      card.appendChild(mcqNode(q,card,ok=>{
        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n&&TBADGE[q.t])unlock(TBADGE[q.t]);
        if(TRAPS&&quizState.traps===TRAPS)unlock('b_trap');
        buildSidebar();updateFoot();}));
      m.appendChild(card);});
  });
  const rc=el('div','card hidden');rc.id='resultsCard';m.appendChild(rc);
  buildFoot();buildSidebar();
}

/* =========================================================================
   MODE · PREP MATERIAL (lessons + live calculators)

function calcNode(kind,title){
  const C=D_CALCS[kind]; if(!C)return el('div');
  const box=el('div','calc');
  box.innerHTML='<h4>⚡ '+title+'</h4><p class="hint">'+C.hint+'</p>';
  const inWrap=el('div','cin'), out=el('div','cout');
  const state={}; C.ins.forEach(i=>state[i.k]=i.def);
  const redraw=()=>{out.innerHTML=C.run(state);};
  C.ins.forEach(i=>{
    const lab=el('label');
    lab.innerHTML='<span class="nm">'+i.nm+'</span>';
    let inp,val=null;
    if(i.type==='select'){
      inp=el('select');
      inp.style.cssText='flex:2 1 170px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-family:inherit;font-size:13.5px;padding:7px 10px';
      i.opts.forEach(([v,lbl])=>{const o=el('option',null,lbl);o.value=v;inp.appendChild(o);});
      inp.value=i.def;
      inp.onchange=()=>{state[i.k]=inp.value;redraw();};
    } else {
      inp=el('input');
      inp.type=i.type==='range'?'range':'number';
      if(i.type==='range'){inp.min=i.min;inp.max=i.max;inp.step=i.step;}
      inp.value=i.def;
      val=i.type==='range'?el('span','val',String(i.def)):null;
      inp.oninput=()=>{const raw=parseFloat(inp.value);state[i.k]=isNaN(raw)?0:raw;if(val)val.textContent=String(state[i.k]);redraw();};
    }
    lab.appendChild(inp); if(val)lab.appendChild(val);
    inWrap.appendChild(lab);
  });
  box.appendChild(inWrap);box.appendChild(out);redraw();
  return box;
}
function renderLearn(){
  const m=$('#main');m.innerHTML='';
  const L=D_LESSON[LESSON], ti=D_TOPICS.findIndex(x=>x.id===LESSON);
  if(!L){m.appendChild(el('div','card','<h1 class="tt">No lesson for this section</h1>'));buildSidebar();return;}
  const head=el('div','card');
  head.innerHTML='<div class="eyebrow">'+L.eyebrow+' · Prep Material</div>'+
    '<h1 class="tt">'+L.title+' 📖</h1><div class="sub">'+L.sub+'</div>'+
    '<div class="sub" style="margin-top:9px">Read it through, drive the <b>live calculators</b> yourself, then take the check at the bottom.</div>';
  m.appendChild(head);
  const body=el('div','card');
  let n=0;
  L.steps.forEach(st=>{
    if(st.type==='text'){n++;
      const d=el('div','lstep');
      d.innerHTML='<h4><span class="n">'+String(n).padStart(2,'0')+'</span>'+st.title+'</h4><p>'+st.body+'</p>';
      body.appendChild(d);
    } else if(st.type==='formula'){
      const d=el('div','fcard');
      d.innerHTML='<span class="pill">'+st.pill+'</span><div class="leg">'+
        st.legend.map(l=>'<div><b class="sym">'+l[0]+'</b><span>'+l[1]+'</span></div>').join('')+'</div>';
      body.appendChild(d);
    } else if(st.type==='table'){
      const d=el('div','ltab');
      d.innerHTML='<h4>'+st.title+'</h4><div class="sc"><table><thead><tr>'+
        st.head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
        st.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      body.appendChild(d);
    } else if(st.type==='calc'){ body.appendChild(calcNode(st.calc,st.title));
    } else if(st.type==='watch'){
      const d=el('div','watch');
      d.innerHTML='<h5>⚠ '+st.title+'</h5><p>'+st.body+'</p>';
      body.appendChild(d);
    }
  });
  m.appendChild(body);
  if(L.check&&L.check.length){
    const ck=el('div','card');
    ck.innerHTML='<div class="eyebrow">Check yourself</div><h1 class="tt">'+L.check.length+' quick questions</h1>'+
      '<div class="sub">Straight from what you just read. Clear them all and this section is marked done in the sidebar.</div>';
    let got=0;
    L.check.forEach((q,i)=>{
      const card=el('div','qcard');
      card.appendChild(el('div','qnum','<span>Check '+(i+1)+' / '+L.check.length+'</span>'));
      card.appendChild(mcqNode(q,card,ok=>{
        if(ok&&++got===L.check.length){
          LEARNED[LESSON]=true;buildSidebar();
          if(D_TOPICS.every(x=>LEARNED[x.id]))unlock('b_learn');
          toast('✅','Section revised','“'+L.title+'” is marked done.');
        }
      }));
      ck.appendChild(card);
    });
    const nav=el('div','lnav');
    const prev=D_TOPICS[ti-1], next=D_TOPICS[ti+1];
    if(prev){const b=el('button','btn btn-ghost','← '+prev.name);
      b.onclick=()=>{LESSON=prev.id;renderLearn();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};nav.appendChild(b);}
    nav.appendChild(el('div','sp'));
    if(next){const b=el('button','btn btn-grad',next.name+' →');
      b.onclick=()=>{LESSON=next.id;renderLearn();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};nav.appendChild(b);}
    ck.appendChild(nav);
    m.appendChild(ck);
  }
  buildSidebar();
}

    '<div class="sub"><b>'+D_PAPER.length+' questions · '+total+' marks.</b> '+(CFG.paperIntro||'A scenario, two or three parts, and an answer that has to show its working.')+'</div>'+
    '<div class="sub" style="margin-top:10px">Work each one on paper <b>first</b> — commit to a recommendation, then open the model answer. '+
    'Each one ends with a <b>marking scheme</b>: if your version has all the points, the wording does not matter.</div>';
  m.appendChild(intro);
  const groups=D_TOPICS.length?D_TOPICS:[{id:null,name:'Questions'}];
  let n=0;
  groups.forEach((t,ti)=>{
    const qs=t.id?D_PAPER.filter(p=>p.t===t.id):D_PAPER;
    if(!qs.length)return;
    if(t.id){
      const h=el('div','qgroup-h');h.id='pgrp-'+t.id;
      h.innerHTML='<span class="gi">'+String(ti+1).padStart(2,'0')+'</span><span class="gt">'+t.name+'</span>'+
        '<span class="gc">'+qs.reduce((a,b)=>a+(b.marks||5),0)+' marks</span>';
      m.appendChild(h);
    }
    qs.forEach(P=>{
      n++;
      const card=el('div','pq');
      card.innerHTML='<div class="ph"><span class="pn">Question '+n+' / '+D_PAPER.length+'</span><span class="mk">'+(P.marks||5)+' marks</span></div>'+
        '<div class="pqt">'+P.title+'</div><p class="sub">'+P.body+'</p>'+
        (P.parts?'<ol class="parts">'+P.parts.map(x=>'<li>'+x+'</li>').join('')+'</ol>':'');
      const idx='p'+n;
      const ansBox=el('div','ans');
      ansBox.innerHTML='<h5>Model answer</h5>'+(P.svg&&typeof dsSvg==='function'?dsSvg(P.svg):'')+P.ans+
        (P.rubric?'<div class="rub"><h6>Marking scheme — what the examiner wants</h6><ul>'+
          P.rubric.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>':'');
      const btn=el('button','btn btn-grad btn-rev','Show model answer ↓');
      btn.onclick=()=>{
        const open=ansBox.classList.toggle('show');
        btn.textContent=open?'Hide model answer ↑':'Show model answer ↓';
        if(open&&!OPENED[idx]){OPENED[idx]=1;buildSidebar();
          if(Object.keys(OPENED).length===EXAM_OPEN+D_PAPER.length)unlock('b_written');}
      };
      card.appendChild(btn);card.appendChild(ansBox);
      m.appendChild(card);
    });
  });
  if(CFG.examDayPlan){
    const end=el('div','card');
    end.innerHTML='<div class="eyebrow">Last thing before the exam</div><h1 class="tt">The exam-day plan 🎓</h1>'+
      '<div class="plan">'+CFG.examDayPlan.map((t,i)=>'<div class="pstep"><span class="pi">'+String(i+1).padStart(2,'0')+'</span><span class="pt">'+t+'</span></div>').join('')+'</div>';
    m.appendChild(end);
  }
  buildSidebar();
}

/* =========================================================================
   SIDEBAR · FOOTER · RESULTS
   ========================================================================= */
function buildSidebar(){
  const list=$('#topicList');list.innerHTML='';
  if(MODE==='exam'){
    D_CASES.forEach((C,i)=>{
      const p=examState?examState.per[C.id]:{c:0,n:0,a:0};
      const opens=C.qs.filter(q=>q.open).length;
      const d=el('div','topic'+(p.n&&p.a===p.n&&p.c===p.n?' done':''));
      d.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="nm">'+C.title.split('—')[0].trim()+'<small>'+p.n+' MCQ'+(opens?' · '+opens+' written':'')+'</small></span>'+
        '<span class="sc">'+p.c+'/'+p.n+'</span>';
      d.onclick=()=>{const h=document.getElementById('case-'+C.id);
        if(h){h.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),600);}};
      list.appendChild(d);});
    $('#pbar').style.width=(EXAM_MCQ?(examState?examState.answered:0)/EXAM_MCQ*100:0)+'%';
    return;
  }
  if(MODE==='paper'){
    const groups=D_TOPICS.length?D_TOPICS:[];
    groups.forEach((t,i)=>{
      const qs=D_PAPER.filter(p=>p.t===t.id);if(!qs.length)return;
      const d=el('div','topic');
      d.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="nm">'+t.name+'<small>'+qs.length+' question'+(qs.length>1?'s':'')+' · '+qs.reduce((a,b)=>a+(b.marks||5),0)+' marks</small></span>';
      d.onclick=()=>{const h=document.getElementById('pgrp-'+t.id);
        if(h)h.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});};
      list.appendChild(d);});
    $('#pbar').style.width=(D_PAPER.length?Object.keys(OPENED).filter(k=>k[0]==='p').length/D_PAPER.length*100:0)+'%';
    return;
  }
  if(MODE==='learn'){
    D_TOPICS.forEach((t,i)=>{
      const d=el('div','topic'+(LESSON===t.id?' on':'')+(LEARNED[t.id]?' learned':''));
      d.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="nm">'+t.name+'<small>'+(t.kick||'')+'</small></span><span class="chk">✓</span>';
      d.onclick=()=>{LESSON=t.id;renderLearn();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
      list.appendChild(d);});
    $('#pbar').style.width=(D_TOPICS.filter(t=>LEARNED[t.id]).length/D_TOPICS.length*100)+'%';
    return;
  }
  /* drill */
  if(CORE.length&&CORE.length<D_QUIZ.length){
    const core=el('div','topic scope'+(SCOPE==='core'?' on':''));
    core.innerHTML='<span class="idx">◎</span><span class="nm">Core paper<small>'+CORE.length+' questions · every section</small></span>';
    core.onclick=()=>setScope('core');list.appendChild(core);
    const all=el('div','topic scope'+(SCOPE==='all'?' on':''));
    all.innerHTML='<span class="idx">∞</span><span class="nm">Everything<small>'+D_QUIZ.length+' questions · adds the deep cuts</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);
  } else {
    const all=el('div','topic scope'+(FOCUS?'':' on'));
    all.innerHTML='<span class="idx">◎</span><span class="nm">All sections<small>'+D_QUIZ.length+' questions · full paper</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);
  }
  D_TOPICS.forEach((t,i)=>{
    const inScope=ACTIVE.some(q=>q.t===t.id);
    const p=quizState?quizState.per[t.id]:{c:0,n:0,a:0};
    const n=inScope?p.n:D_QUIZ.filter(q=>q.t===t.id).length;
    const d=el('div','topic'+(inScope&&p.a===p.n&&p.n?' done':'')+(t.hot?' hot':'')+(FOCUS===t.id?' on':'')+(inScope?'':' off'));
    d.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span class="nm">'+t.name+(t.hot?' <em class="flame">🔥</em>':'')+'<small>'+(t.kick||'')+'</small></span>'+
      '<span class="sc">'+(inScope?p.c+'/'+p.n:n)+'</span>';
    d.onclick=()=>{
      if(FOCUS===t.id){setScope(CORE.length<D_QUIZ.length?'core':'all');return;}
      const h=document.getElementById('grp-'+t.id);
      if(h&&!FOCUS&&inScope){h.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),600);}
      else setScope('topic',t.id);
    };
    d.ondblclick=()=>setScope('topic',t.id);
    list.appendChild(d);});
  $('#pbar').style.width=(ACTIVE.length?(quizState?quizState.answered:0)/ACTIVE.length*100:0)+'%';
}

function scored(){ return MODE==='exam'?examState:(MODE==='drill'?quizState:null); }

  let f=$('#footbar');if(f)f.remove();

function updateFoot(){
  const s=scored();if(!s||!$('#footLbl'))return;
  $('#footLbl').textContent=s.answered+' / '+s.total+' answered · '+s.correct+' correct'+(G.best?' · best streak '+G.best:'');

function grade(p){
  if(p>=90)return['Outstanding — exam-ready! 🏆','var(--lime)'];
  if(p>=75)return['Strong pass — polish the weak spots. ✅','var(--cyan)'];
  if(p>=60)return['Decent — a focused review will lift this. 📈','var(--gold)'];
  return['Keep going — reread the Why panels and retake. 🔁','var(--red)'];
}
function showResults(){
  const s=scored();if(!s)return;
  const{correct,total,per}=s,pct=Math.round(correct/total*100);
  MISSED=s.missed.slice();
  if(pct>=75)unlock('b_quiz75'); if(pct===100)unlock('b_perfect');
  const rc=$('#resultsCard');rc.className='card';rc.innerHTML='';
  rc.appendChild(el('div',null,'<div class="eyebrow">Results</div><h1 class="tt">Paper complete</h1>'));
  const R=80,C=2*Math.PI*R;const rw=el('div','ring-wrap');
  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+s.traps+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;
  const rows = MODE==='exam'
    ? D_CASES.map(c=>({id:c.id,name:c.cl+' · '+c.title.split('—')[0].trim(),p:per[c.id]}))
    : D_TOPICS.map(t=>({id:t.id,name:t.name,p:per[t.id]}));
  rows.forEach(r=>{const p=r.p;if(!p||!p.n)return;const ratio=p.c/p.n;
    if(weak===null||ratio<weak.r)weak={id:r.id,name:r.name,r:ratio};
    const mt=el('div','meter');
    mt.innerHTML='<div class="top"><span>'+r.name+'</span><span class="sc">'+p.c+'/'+p.n+'</span></div><div class="bar"><i data-w="'+(ratio*100)+'"></i></div>';
    meters.appendChild(mt);});
  rc.appendChild(meters);
  if(weak&&weak.r<1){
    const w=el('div','watch');
    w.innerHTML='<h5>Weakest block: '+weak.name+'</h5><p style="color:#ffd9e0">Reread the Why panels there'+(D_CMAP.length?', then check the matching row set in <b>📋 THE MAP</b>':'')+'.'+
      (MODE==='drill'?' <a style="color:var(--cyan);cursor:pointer" id="goWeak">Drill just this section →</a>':'')+'</p>';
    rc.appendChild(w);}
  const row=el('div','row-btns');
  if(MODE==='drill'&&MISSED.length){
    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');row.appendChild(dr);
  }
  const rt=el('button','btn '+(MODE==='drill'&&MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{MODE==='exam'?renderExam():renderDrill();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);
  MODES.filter(x=>x.id!==MODE).forEach(x=>{
    const b=el('button','btn btn-ghost',x.label+' →');b.onclick=()=>setMode(x.id);row.appendChild(b);});
  if(D_CMAP.length){const mp=el('button','btn btn-ghost','📋 Open the map');mp.onclick=()=>$('#hMap').click();row.appendChild(mp);}
  rc.appendChild(row);
  rc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  requestAnimationFrame(()=>{
    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');
    if(reduced)node.textContent=pct+'%';
    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}
}

/* =========================================================================
   OPTIONAL HELPER · supply & demand diagram for written answers
   Use in a PAPER or open question as   svg:{d:0.2,s:-0.3,cap:'…'}
   d / s  = shift size, positive = rightward.   line:{p,label} draws a
   price ceiling or floor and marks the Qd / Qs gap.
   ========================================================================= */
function dsSvg(o){
  const W=430,H=300,X0=56,X1=390,Y0=34,Y1=250;
  const mx=q=>X0+q*(X1-X0), my=p=>Y1-p*(Y1-Y0);
  const dP=(q,d)=>0.9-0.8*q+d, sP=(q,s)=>0.1+0.8*q-s;
  const eq=(d,s)=>{const q=(0.8+d+s)/1.6;return{q,p:0.1+0.8*q-s};};
  const line=(f,a)=>'M '+mx(0)+' '+my(f(0,a))+' L '+mx(1)+' '+my(f(1,a));
  const d=o.d||0, s=o.s||0, e0=eq(0,0), e1=eq(d,s);
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Supply and demand diagram">'+
    '<defs><clipPath id="cp'+(dsSvg.n=(dsSvg.n||0)+1)+'"><rect x="'+X0+'" y="'+Y0+'" width="'+(X1-X0)+'" height="'+(Y1-Y0)+'"/></clipPath></defs>'+
    '<g clip-path="url(#cp'+dsSvg.n+')">';
  g+='<path d="'+line(dP,0)+'" stroke="#22D3EE" stroke-width="2.4" fill="none"/>'+
     '<path d="'+line(sP,0)+'" stroke="#FBBF24" stroke-width="2.4" fill="none"/>';
  if(d)g+='<path d="'+line(dP,d)+'" stroke="#22D3EE" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  if(s)g+='<path d="'+line(sP,s)+'" stroke="#FBBF24" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  const dot=(q,p,c,r)=>'<circle cx="'+mx(q)+'" cy="'+my(p)+'" r="'+(r||5)+'" fill="'+c+'"/>';
  const dash=(q,p,c)=>'<path d="M '+X0+' '+my(p)+' L '+mx(q)+' '+my(p)+' L '+mx(q)+' '+Y1+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity=".6"/>';
  if(o.line){
    const lp=o.line.p, qd=(0.9-lp)/0.8, qs=(lp-0.1)/0.8;
    g+='<path d="M '+X0+' '+my(lp)+' L '+X1+' '+my(lp)+'" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="8 4" fill="none"/>'+
       '<path d="M '+mx(Math.min(qd,qs))+' '+my(lp)+' L '+mx(Math.max(qd,qs))+' '+my(lp)+'" stroke="#FB7185" stroke-width="7" opacity=".3" fill="none"/>'+
       dot(qs,lp,'#FB7185',4)+dot(qd,lp,'#FB7185',4)+
       '<text x="'+mx(qs)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qs</text>'+
       '<text x="'+mx(qd)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qd</text>';
  }
  g+=dash(e0.q,e0.p,'#9AA6C9')+dot(e0.q,e0.p,'#E7ECFF');
  if(d||s)g+=dash(e1.q,e1.p,'#4ADE80')+dot(e1.q,e1.p,'#4ADE80',6);
  g+='</g>';
  g+='<path d="M '+X0+' '+Y0+' L '+X0+' '+Y1+' L '+X1+' '+Y1+'" stroke="#9AA6C9" stroke-width="1.6" fill="none"/>'+
     '<text x="'+(X0-8)+'" y="'+(Y0+10)+'" fill="#9AA6C9" font-size="12" text-anchor="end">P</text>'+
     '<text x="'+X1+'" y="'+(Y1+20)+'" fill="#9AA6C9" font-size="12" text-anchor="end">Q</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,0))-8)+'" fill="#22D3EE" font-size="12" text-anchor="end">D</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,0))+16)+'" fill="#FBBF24" font-size="12" text-anchor="end">S</text>';
  if(d)g+='<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,d))+(d>0?-8:16))+'" fill="#22D3EE" font-size="12" text-anchor="end">D₂</text>';
  if(s)g+='<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,s))+(s>0?16:-8))+'" fill="#FBBF24" font-size="12" text-anchor="end">S₂</text>';
  if(o.line)g+='<text x="'+(X0+8)+'" y="'+(my(o.line.p)-8)+'" fill="#FB7185" font-size="12">'+o.line.label+'</text>';
  g+='</svg>';
  return '<div class="dsg">'+g+'<div class="cap">'+(o.cap||'')+'</div></div>';
}

/* ---------- init ---------- */
if(!D_CMAP.length)$('#hMap').style.display='none';
renderModeToggle();
$('#sideH').textContent=(MODES.find(x=>x.id===MODE)||{}).side||'Sections';
renderHUD();
if(MODE==='exam')renderExam(); else if(MODE==='learn')renderLearn(); else if(MODE==='paper')renderPaper(); else renderDrill();
</script>
</body>
</html>
